# Build the site on GitHub Actions and deploy it to Netlify.
# The full build (~2,400 pages, ~20 min, ~9 GB peak memory) is too big for Netlify's own
# build machines, so Netlify only hosts: the Netlify CLI runs the build here (with the
# Next.js runtime plugin) and uploads the result.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#   WORDPRESS_URL, WORDPRESS_REVALIDATE_SECONDS, WORDPRESS_SITE_NAME,
#   WORDPRESS_SECTION_TIMEOUT_MS, REVALIDATE_SECRET
name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an older in-progress run.
concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
      WORDPRESS_REVALIDATE_SECONDS: ${{ secrets.WORDPRESS_REVALIDATE_SECONDS }}
      WORDPRESS_SITE_NAME: ${{ secrets.WORDPRESS_SITE_NAME }}
      WORDPRESS_SECTION_TIMEOUT_MS: ${{ secrets.WORDPRESS_SECTION_TIMEOUT_MS }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse Next.js's build cache between runs (much faster TypeScript/compile steps).
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Builds with netlify.toml's command and the Next.js runtime, then publishes to production.
      - name: Build and deploy
        run: npx --yes netlify-cli@latest deploy --build --prod --message "GitHub Actions ${{ github.sha }}"
